<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="materials_catalog">Materials Catalog - BuildConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-bottom {
            backdrop-filter: blur(10px);
            background: rgba(45, 55, 72, 0.95);
        }
        .filter-active {
            background: linear-gradient(135deg, #38A169, #48BB78);
            color: white;
        }
        .material-card {
            transition: all 0.3s ease;
        }
        .material-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .calculator-panel {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <button onclick="navigateTo('index.html')" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-800" data-translate="materials_catalog">Materials Catalog</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                    <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 5M7 13l2.5 5m6-5v5a2 2 0 11-4 0v-5m4 0V9a2 2 0 10-4 0v4.01"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Tabs -->
    <section class="bg-white border-b border-gray-200 sticky top-16 z-30">
        <div class="container mx-auto px-6 py-4">
            <div class="flex space-x-2 overflow-x-auto">
                <button onclick="filterMaterials('all')" class="filter-btn filter-active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all" data-translate="all_materials">
                    All Materials
                </button>
                <button onclick="filterMaterials('foundation')" class="filter-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all" data-translate="foundation">
                    Foundation
                </button>
                <button onclick="filterMaterials('structural')" class="filter-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all" data-translate="structural">
                    Structural
                </button>
                <button onclick="filterMaterials('decorative')" class="filter-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all" data-translate="decorative">
                    Decorative
                </button>
                <button onclick="filterMaterials('insulation')" class="filter-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all" data-translate="insulation">
                    Insulation
                </button>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <div class="grid lg:grid-cols-3 gap-8">
            <!-- Materials Grid -->
            <div class="lg:col-span-2">
                <div class="grid md:grid-cols-2 gap-6" id="materials-grid">
                    <!-- Material cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Calculator Sidebar -->
            <div class="lg:col-span-1">
                <div class="calculator-panel rounded-xl p-6 sticky top-32">
                    <h3 class="text-xl font-bold text-gray-800 mb-6" data-translate="quick_calculator">Material Calculator</h3>
                    
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="project_type">Project Type</label>
                            <select id="project-type" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                                <option value="foundation" data-translate="foundation_type">Foundation</option>
                                <option value="walls" data-translate="walls_type">Walls</option>
                                <option value="flooring" data-translate="flooring_type">Flooring</option>
                                <option value="roofing" data-translate="roofing_type">Roofing</option>
                            </select>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="length_m">Length (m)</label>
                                <input type="number" id="calc-length" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="10" value="10">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="width_m">Width (m)</label>
                                <input type="number" id="calc-width" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="8" value="8">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="height_thickness">Height/Thickness (m)</label>
                            <input type="number" id="calc-height" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="0.3" value="0.3" step="0.1">
                        </div>
                    </div>

                    <div class="bg-white rounded-lg p-4 mb-6">
                        <h4 class="font-semibold text-gray-800 mb-3" data-translate="calculation_results">Calculation Results</h4>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600" data-translate="volume">Volume:</span>
                                <span class="font-bold text-green-600" id="calc-volume">24.0 m³</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600" data-translate="material_bags_label">Material Bags:</span>
                                <span class="font-bold text-red-600" id="calc-bags">48</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600" data-translate="estimated_cost_label">Estimated Cost:</span>
                                <span class="font-bold text-blue-600" id="calc-cost">$2,400</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="addToQuote()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold transition-colors" data-translate="add_to_quote">
                            Add to Quote
                        </button>
                        <button onclick="requestDetailedQuote()" class="w-full border-2 border-green-600 text-green-600 hover:bg-green-600 hover:text-white py-3 rounded-lg font-semibold transition-colors" data-translate="request_detailed_quote">
                            Request Detailed Quote
                        </button>
                    </div>

                    <!-- Selected Materials -->
                    <div class="mt-8">
                        <h4 class="font-semibold text-gray-800 mb-4" data-translate="selected_materials">Selected Materials</h4>
                        <div id="selected-materials" class="space-y-3">
                            <div class="text-gray-500 text-sm text-center py-4" data-translate="no_materials_selected">
                                No materials selected
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="nav-bottom fixed bottom-0 left-0 right-0 z-50 border-t border-gray-700">
        <div class="flex justify-around items-center py-3">
            <button onclick="navigateTo('index.html')" class="flex flex-col items-center space-y-1 text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                </svg>
                <span class="text-xs font-medium" data-translate="home">Home</span>
            </button>
            <button onclick="navigateTo('materials.html')" class="flex flex-col items-center space-y-1 text-white">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                </svg>
                <span class="text-xs font-medium" data-translate="materials">Materials</span>
            </button>
            <button onclick="navigateTo('projects.html')" class="flex flex-col items-center space-y-1 text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
                </svg>
                <span class="text-xs font-medium" data-translate="projects">Projects</span>
            </button>
            <button onclick="navigateTo('referrals.html')" class="flex flex-col items-center space-y-1 text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-xs font-medium" data-translate="referrals">Referrals</span>
            </button>
        </div>
    </nav>

    <!-- Add bottom padding to prevent content from being hidden behind nav -->
    <div class="h-20"></div>

    <script src="translations.js"></script>
    <script src="main.js"></script>
</body>
</html>
